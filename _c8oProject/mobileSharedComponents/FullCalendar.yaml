comment: |
  'FullCalendar 7.0.1 Standard wrapper for Convertigo NGX.
  
  Renders an interactive calendar through @fullcalendar/angular with the Classic theme and the bundled DayGrid, TimeGrid, List, MultiMonth and Interaction plugins. Premium Scheduler/resource views are not included.
  
  All public inputs are applied at initialization. locale, initialView, headerToolbar, buttonText, selectable, calEvents, editable, height, initialDate, multiMonthMaxColumns, eventTimeFormat, displayEventEnd, eventMinHeight, eventShortHeight and slotEventOverlap are also handled reactively after initialization.
  
  Styles
  The shared component deliberately contains no presentation CSS. The consuming application owns the appearance of events.
  
  The component exposes these stable CSS hooks:
  - occupied: every foreground event; retained for compatibility
  - c8o-fc-timegrid-event: timed event in TimeGrid week/day views
  - c8o-fc-event-inner: event inner container
  - c8o-fc-event-time: rendered time text
  - c8o-fc-event-title: rendered title
  
  Define rules in a global application UIStyle under Application > NgxApp. The demonstration project provides the dedicated NgxApp.FullCalendarStyle object as a complete copyable example. It is optional and is not embedded in the shared component.
  
  Use an event''s color and contrastColor fields for its palette. Use className for application variants such as event--confirmed or event--cancelled. To style only one calendar instance, wrap its UIUseShared control in an application container class and prefix selectors with that class.
  
  Avoid FullCalendar generated fc-classic-* classes. They are internal implementation details; prefer the documented occupied and c8o-fc-* hooks.
  
  See the comment on NgxApp.FullCalendarStyle for installation steps, selector examples and per-event variants.
  
  Outputs:
  - DateClicked: emits the native JavaScript Date for a clicked date/time cell.
  - EventChanged: emits a plain event object after an event change.
  - calEventsChange: supports two-way binding when an editable event is changed.
  
  FullCalendar documentation: https://fullcalendar.io/docs'
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import dayGridPlugin from ''@fullcalendar/angular/daygrid'';
        import listPlugin from ''@fullcalendar/angular/list'';
        import monthPlugin from ''@fullcalendar/angular/multimonth'';
        import timeGridPlugin from ''@fullcalendar/angular/timegrid'';
        import interactionPlugin from ''@fullcalendar/angular/interaction'';
        import themePlugin from ''@fullcalendar/angular/themes/classic'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	public calendarOptions: CalendarOptions;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		this.calendarOptions = {
        			events: this.calEvents,
        			headerToolbar: this.headerToolbar,
        			selectable: this.selectable,
        			selectMirror: true,
        			buttons: this.toV7Buttons(this.buttonText),
        			initialView: this.initialView,
        			plugins: [themePlugin, dayGridPlugin, listPlugin, monthPlugin, timeGridPlugin, interactionPlugin],
        			locale: this.locale,
        			editable: this.editable,
        			height: this.height,
        			initialDate: this.initialDate,
        			multiMonthMaxColumns: this.multiMonthMaxColumns,
        			eventTimeFormat: this.eventTimeFormat,
        			displayEventEnd: this.displayEventEnd,
        			eventMinHeight: this.eventMinHeight,
        			eventShortHeight: this.eventShortHeight,
        			slotEventOverlap: this.slotEventOverlap,
        			dateClick: (info) => {
        				this.DateClicked.emit(info.date);
        			},
        			eventClass: (info) => info.view.type.indexOf(''timeGrid'') === 0
        				? ''occupied c8o-fc-timegrid-event''
        				: ''occupied'',
        			eventInnerClass: ''c8o-fc-event-inner'',
        			eventTimeClass: ''c8o-fc-event-time'',
        			eventTitleClass: ''c8o-fc-event-title'',
        			singleMonthTitleFormat: {month: ''long'', year: ''numeric''},
        			eventChange: (info) => {
        				this.updateEvent(info);
        			}
        		};
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		Object.keys(changes).forEach((key) => {
        			const change = changes[key];
        			if (change.firstChange) {
        				return;
        			}
        
        			switch (key) {
        				case "calEvents":
        					this.setCalendarOption("events", Array.isArray(change.currentValue) ? change.currentValue : []);
        					break;
        				case "initialDate":
        					this.calendarOptions = {...this.calendarOptions, initialDate: change.currentValue};
        					if (change.currentValue !== undefined && change.currentValue !== null && change.currentValue !== "") {
        						const calendarApi = this.getCalendarApi();
        						if (calendarApi) {
        							calendarApi.gotoDate(change.currentValue);
        						}
        					}
        					break;
        				case "initialView":
        					this.calendarOptions = {...this.calendarOptions, initialView: change.currentValue};
        					if (change.currentValue) {
        						const calendarApi = this.getCalendarApi();
        						if (calendarApi) {
        							calendarApi.changeView(change.currentValue);
        						}
        					}
        					break;
        				case "locale":
        				case "headerToolbar":
        				case "selectable":
        				case "editable":
        				case "height":
        				case "multiMonthMaxColumns":
        				case "eventTimeFormat":
        				case "displayEventEnd":
        				case "eventMinHeight":
        				case "eventShortHeight":
        				case "slotEventOverlap":
        					this.setCalendarOption(key as keyof CalendarOptions, change.currentValue);
        					break;
        				case "buttonText":
        					this.setCalendarOption("buttons", this.toV7Buttons(change.currentValue));
        					break;
        			}
        		});
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	private getCalendarApi() {
        		return this.calendar && this.calendar.getApi ? this.calendar.getApi() : null;
        	}
        
        		private setCalendarOption(optionName: keyof CalendarOptions, value: any): void {
        			this.calendarOptions = {...this.calendarOptions, [optionName]: value};
        			const calendarApi = this.getCalendarApi();
        			if (calendarApi) {
        				calendarApi.setOption(optionName, value);
        			}
        		}
        
        	private toV7Buttons(buttonText: any): any {
        		const buttons: any = {};
        		const aliases: any = {
        			month: ["dayGridMonth"],
        			week: ["dayGridWeek", "timeGridWeek"],
        			day: ["timeGridDay"],
        			list: ["listDay", "listWeek", "listMonth", "listYear"],
        			year: ["multiMonthYear"]
        		};
        		if (buttonText && typeof buttonText === "object") {
        			Object.keys(buttonText).forEach((name) => {
        				const button = {text: String(buttonText[name])};
        				buttons[name] = button;
        				(aliases[name] || []).forEach((viewName: string) => {
        					buttons[viewName] = button;
        				});
        			});
        		}
        		return buttons;
        	}
        
        	public updateEvent(info: any): void {
        		if (!info || !info.event) {
        			return;
        		}
        
        		const updatedEvent = info.event.toPlainObject();
        		const id = updatedEvent.id;
        		if (id === undefined || id === null || id === "") {
        			this.EventChanged.emit(updatedEvent);
        			return;
        		}
        
        		const currentEvents = Array.isArray(this.calEvents) ? this.calEvents : [];
        		const index = currentEvents.findIndex((event) =>
        			event && event.id !== undefined && String(event.id) === String(id)
        		);
        		const nextEvents = index >= 0
        			? currentEvents.map((event, currentIndex) => currentIndex === index ? updatedEvent : event)
        			: [...currentEvents, updatedEvent];
        
        		this.calEvents = nextEvents;
        		this.calendarOptions = {...this.calendarOptions, events: nextEvents};
        		this.calEventsChange.emit(nextEvents);
        		this.EventChanged.emit(updatedEvent);
        	}
        /*End_c8o_CompFunction*/
        '
